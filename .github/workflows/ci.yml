name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches:  [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:

     - name: Checkout code
       uses: actions/checkout@v4

     - name: Setup Terraform
       uses: hashicorp/setup-terraform@v3

     - name: Terraform Format Check
       run: terraform fmt -check -recursive ./terraform

     - name: Terraform Validate
       run: terraform init -backend=false && terraform validate

     - name: Build Docker image
       run: docker build -t cloud-native-app:ci ./app

     - name: Start Container
       run: docker run -d --name smoke -p 8080:80 cloud-native-app:ci

     - name: Wait for app to boot
       run: sleep 5

     - name: Show container status
       run: docker ps -a

     - name: Smoke test with curl
       run:  curl --fail --retry 5 --retry-all-errors --retry-delay 2 http://localhost:8080

     - name: Show container logs after test
       if: always()
       run: docker logs smoke

       
      
