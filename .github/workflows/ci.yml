name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches:  [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:

     - name: Checkout code
       uses: actions/checkout@v4

     - name: Build Docker image
       run: docker build -t cloud-native-app:ci ./app

     - name: Start Container
       run: docker run -d --name smoke -p 8080:80 cloud-native-app:ci

     - name: Show container status
       run: docker ps -a

     - name: Show container logs
       run: docker logs smoke

     - name: Smoke test with curl
       run:  curl --fail --retry 5 --retry-connrefused --retry-delay 2 http://localhost:8080
      